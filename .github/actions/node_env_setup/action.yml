name: Set up Node.js environment

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5

    # pnpm/action-setup runs first so setup-node can resolve the pnpm store
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Cache Cypress Binary
      id: cache-cypress-binary
      uses: actions/cache@v5
      with:
        path: ~/.cache/Cypress
        key: binary-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

    - name: Install Volto dependencies
      shell: bash
      run: make install

    - name: Install Cypress if not in cache
      if: steps.cache-cypress-binary.outputs.cache-hit != 'true'
      shell: bash
      working-directory: packages/volto
      run: make cypress-install

inputs:
  node-version:
    description: 'Node.js version'
    required: true
