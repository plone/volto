name: Volto Light Theme

on: [push, pull_request]

jobs:
  volto-light-theme:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    name: Volto Light Theme
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    env:
      project-directory: volto-light-theme
    steps:
      - name: Checkout Volto Light Theme (main)
        uses: actions/checkout@v5
        with:
          repository: kitconcept/volto-light-theme
          ref: main
          path: ${{ env.project-directory }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ env.project-directory }}/frontend/package.json
          cache: true
          cache_dependency_path: ${{ env.project-directory }}/frontend/pnpm-lock.yaml

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Volto Light Theme frontend
        working-directory: ${{ env.project-directory }}/frontend
        # Same `make install` steps, but fetch the Volto branch from the push
        # into the `core` folder before installing the dependencies.
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          (cd core && git fetch --depth 1 origin "${GITHUB_REF}" && git checkout FETCH_HEAD)
          pnpm i --no-frozen-lockfile
          make build-deps

      - name: Running lint works
        working-directory: ${{ env.project-directory }}/frontend
        run: make lint

      - name: Build Storybook
        working-directory: ${{ env.project-directory }}/frontend
        run: make storybook-build

      - name: Run i18n tests
        working-directory: ${{ env.project-directory }}/frontend
        run: make i18n

      - name: Running tests works
        working-directory: ${{ env.project-directory }}/frontend
        run: make ci-test
