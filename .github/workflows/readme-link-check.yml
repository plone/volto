# Check links in all README.md files and other *.md files at the repo root with lychee.
# https://github.com/lycheeverse/lychee-action
#
# - On pull requests and pushes to main, only links inside the repository
#   (relative paths and anchors) are checked. These checks are deterministic,
#   so they block the build.
# - External URLs are checked once a week (or on demand). Broken ones are
#   reported in a single "link-check" issue instead of failing unrelated PRs.
#
# Shared settings and exclusions live in lychee.toml at the repository root.
name: README.md link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  internal-links:
    name: Internal links
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --offline
            --include-fragments
            'packages/**/README.md'
            '*.md'

  external-links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check external links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: ./lychee/out.md
          args: >-
            'packages/**/README.md'
            '*.md'

      - name: Find the open link check issue
        id: issue
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label link-check --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links in README files
          content-filepath: ./lychee/out.md
          labels: link-check
          issue-number: ${{ steps.issue.outputs.number }}

      - name: Close the issue when all links work again
        if: steps.lychee.outputs.exit_code == 0 && steps.issue.outputs.number != ''
        run: gh issue close "${{ steps.issue.outputs.number }}" --repo "${{ github.repository }}" --comment "All links work again."
