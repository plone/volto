name: Code Analysis Check
on: [push, pull_request]

env:
  node-version: 24.x

jobs:
  prettier:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node and pnpm setup
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - run: pnpm i

      - name: Prettier check
        run: pnpm prettier

  eslint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ESlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node and pnpm setup
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - run: pnpm i

      - name: Main ESlint check
        run: pnpm lint

      - name: Volto ESlint check
        run: pnpm lint:volto

  stylelint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node and pnpm setup
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - run: pnpm i

      - name: Volto Stylelint check
        run: pnpm --filter @plone/volto stylelint

      - name: Components Stylelint check
        run: pnpm --filter @plone/components stylelint

  i18n:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node and pnpm setup
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - run: pnpm i

      - name: i18n locales in sync
        run: pnpm i18n:ci

  build-types:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Build Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node and pnpm setup
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - run: pnpm i

      - name: Build packages
        run: make build-deps

      - name: Build @plone/volto types
        run: pnpm --filter @plone/volto build:types
